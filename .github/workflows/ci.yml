name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-go:
    name: lint-go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: ./services/location-service/... ./services/matching-service/... ./shared/geospatial/... ./shared/matching-algorithms/... ./shared/models/go/... ./shared/dynamo-client/go/...

  test-go:
    name: test-go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go tests
        run: go test ./services/location-service/... ./services/matching-service/... ./shared/geospatial/... ./shared/matching-algorithms/... ./shared/models/go/... ./shared/dynamo-client/go/... -race -cover

  lint-node:
    name: lint-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=@ride-dispatch/models
          npm run build --workspace=@ride-dispatch/dynamo-client
          npm run build --workspace=@ride-dispatch/auth
          npm run build --workspace=@ride-dispatch/sns-client
          npm run build --workspace=@ride-dispatch/logging

      - name: Run ESLint
        run: npm run lint

  test-node:
    name: test-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=@ride-dispatch/models
          npm run build --workspace=@ride-dispatch/dynamo-client
          npm run build --workspace=@ride-dispatch/auth
          npm run build --workspace=@ride-dispatch/sns-client
          npm run build --workspace=@ride-dispatch/logging

      - name: Run tests
        run: npm test

  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=@ride-dispatch/models
          npm run build --workspace=@ride-dispatch/dynamo-client
          npm run build --workspace=@ride-dispatch/auth
          npm run build --workspace=@ride-dispatch/sns-client
          npm run build --workspace=@ride-dispatch/logging
          npm run build --workspace=@ride-dispatch/notification-service

      - name: Start LocalStack

        run: docker compose up -d

      - name: Wait for LocalStack
        run: |
          bash scripts/wait-for-localstack.sh
          sleep 30
          # Add health check retries
          for i in {1..10}; do
            if aws s3 ls --endpoint-url http://localhost:4566 2>/dev/null; then
              echo "LocalStack is healthy"
              break
            fi
            echo "Waiting for LocalStack health check... attempt $i/10"
            sleep 3
          done

      - name: Run LocalStack Smoke Test
        run: bash scripts/smoke-test-localstack.sh

      - name: Build Lambda Artifacts
        run: |
          bash scripts/build-go-lambda.sh services/location-service update-location
          bash scripts/build-go-lambda.sh services/location-service update-status
          bash scripts/build-node-lambda.sh services/auth-stub src/authorizer.ts authorizer
          bash scripts/build-node-lambda.sh services/trip-service src/handlers/request-ride-entry.ts request-ride
          bash scripts/build-node-lambda.sh services/trip-service src/handlers/get-ride-entry.ts get-ride
          bash scripts/build-node-lambda.sh services/trip-service src/handlers/cancel-ride-entry.ts cancel-ride
          bash scripts/build-node-lambda.sh services/trip-service src/handlers/list-rider-rides-entry.ts list-rider-rides
          bash scripts/build-node-lambda.sh services/trip-service src/handlers/internal-assign-driver-entry.ts assign-driver
          bash scripts/build-node-lambda.sh services/trip-service src/handlers/reassign-stale-matches-entry.ts reassign-stale-matches
          bash scripts/build-node-lambda.sh services/notification-service src/handlers/connect.ts connect
          bash scripts/build-node-lambda.sh services/notification-service src/handlers/disconnect.ts disconnect
          bash scripts/build-node-lambda.sh services/notification-service src/handlers/sns-fanout-entry.ts fanout
          bash scripts/build-go-lambda.sh services/event-forwarder event-forwarder

      - name: Verify LocalStack Connectivity
        run: |
          for i in {1..30}; do
            if aws s3 ls --endpoint-url=http://localhost:4566 2>/dev/null; then
              echo "LocalStack is ready"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack failed to start"
          exit 1

      - name: Provision Terraform Infrastructure against LocalStack
        run: |
          # Backend override: Temporarily disable the remote S3 backend configuration
          # in CI so Terraform uses a local state file for LocalStack integration testing,
          # as real AWS S3 remote backend credentials are not available or needed here.
          mv infra/backend.tf infra/backend.tf.bak
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=us-east-1
          unset AWS_SESSION_TOKEN
          unset AWS_SECURITY_TOKEN
          cd infra
          terraform init
          export TF_LOG=DEBUG
          export TF_LOG_PATH=/tmp/terraform.log
          export TF_LOG_CORE=TRACE

          # Increase provider timeout
          export TF_CLI_CONFIG_FILE=/tmp/.terraformrc
          cat > $TF_CLI_CONFIG_FILE <<EOF
          provider_installation {
            direct {}
          }
          EOF

          # Retry logic with better diagnostics and parallelism limit to reduce load on LocalStack
          for i in {1..5}; do
            echo "Terraform apply attempt $i/5..."
            if terraform plan -input=false -var-file=local.tfvars -parallelism=2 -out=tfplan 2>&1 | tee plan.log && \
               terraform apply -input=false -parallelism=2 -no-color tfplan 2>&1 | tee apply.log; then
              echo "Terraform apply succeeded"
              break
            elif [ $i -lt 5 ]; then
              echo "Attempt $i failed, retrying after 10 seconds..."
              sleep 10
              terraform refresh || true
            else
              echo "=== TERRAFORM PLAN ERRORS ==="
              grep -i "error\|warning" plan.log || cat plan.log | tail -n 100
              echo "=== TERRAFORM APPLY ERRORS ==="
              grep -i "error\|warning" apply.log || cat apply.log | tail -n 100
              echo "=== TERRAFORM DEBUG LOGS ==="
              tail -n 500 /tmp/terraform.log
              echo "=== LOCALSTACK CONTAINER LOGS ==="
              docker logs ride-dispatch-localstack --tail 300
              exit 1
            fi
          done

      - name: Run DynamoDB Schema Integration Test
        run: bash tests/integration/dynamodb-schema-test.sh

      - name: Run Go DynamoDB Client Integration Tests
        run: go test -tags=integration ./shared/dynamo-client/go/... -v

      - name: Run TypeScript DynamoDB Client Integration Tests
        run: npm run test:integration --workspace=@ride-dispatch/dynamo-client

      - name: Run Location Service End-to-End Integration Test
        run: bash tests/integration/location-service-test.sh

      - name: Run Trip Service End-to-End Integration Test
        run: bash tests/integration/trip-service-test.sh

      - name: Run SQS and SNS Infrastructure Integration Test
        run: bash tests/integration/sqs-sns-infra-test.sh

      - name: Run Observability Infrastructure Integration Test
        run: bash tests/integration/observability-infra-test.sh

      - name: Run Event Forwarder Integration Test
        run: bash tests/integration/event-forwarder-test.sh

      - name: Build Notification Service
        run: npm run build --workspace=@ride-dispatch/notification-service

      - name: Run Notification Service WebSocket Integration Test
        env:
          JWT_SECRET: 'dev-jwt-secret-for-ride-dispatch-local-testing'
        run: node tests/integration/notification-connections-test.js

      # Module 18: Fast single-driver/single-rider smoke test
      - name: Run Matching Service Smoke End-to-End Test
        run: bash tests/integration/matching-service-e2e-test.sh

      # Module 19: Full multi-agent stochastic verification using both Driver and Rider Simulators
      # Both tests coexist intentionally: the narrow smoke test provides rapid failure diagnosis on basic
      # wiring, while this full test provides confidence that concurrent multi-agent traffic converges.
      - name: Run Full End-to-End Naive Flow Verification (Simulators)
        env:
          DRIVER_COUNT: '5'
          RIDER_COUNT: '3'
          RUN_DURATION_SECONDS: '45'
          MIN_MATCH_SUCCESS_RATE: '0.5'
        run: bash tests/integration/e2e-naive-flow-test.sh

      # Module 27: Fault-tolerance hardening tests
      - name: Run Stale Match Reassignment Integration Test
        run: bash tests/integration/stale-match-reassignment-test.sh

      - name: Validate DLQ Redrive Tooling
        run: |
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=us-east-1
          ENDPOINT_URL="http://localhost:4566"
          DLQ_URL=$(aws sqs get-queue-url --endpoint-url "$ENDPOINT_URL" --queue-name "ride-dispatch-platform-local-ride-request-events-dlq" --query "QueueUrl" --output text)
          SRC_URL=$(aws sqs get-queue-url --endpoint-url "$ENDPOINT_URL" --queue-name "ride-dispatch-platform-local-ride-request-events" --query "QueueUrl" --output text)

          # Purge queues
          aws sqs purge-queue --endpoint-url "$ENDPOINT_URL" --queue-url "$DLQ_URL" 2>/dev/null || true
          aws sqs purge-queue --endpoint-url "$ENDPOINT_URL" --queue-url "$SRC_URL" 2>/dev/null || true
          sleep 1

          # Send a test message directly to DLQ
          TEST_MSG="{\"test\":\"dlq-redrive-validation\",\"id\":\"$RANDOM\"}"
          echo "Sending test message to DLQ: $DLQ_URL"
          aws sqs send-message --endpoint-url "$ENDPOINT_URL" --queue-url "$DLQ_URL" --message-body "$TEST_MSG"

          # Run the redrive script
          export AWS_ENDPOINT_URL="$ENDPOINT_URL"
          bash scripts/redrive-dlq.sh "$DLQ_URL" "$SRC_URL"

          # Verify message arrived in source queue
          echo "Verifying message arrived in source queue: $SRC_URL"
          RCV=$(aws sqs receive-message --endpoint-url "$ENDPOINT_URL" --queue-url "$SRC_URL" --max-number-of-messages 10)
          echo "$RCV" | grep -q "dlq-redrive-validation" || { echo "Message missing from source queue!"; exit 1; }

          # Verify DLQ is now empty
          DLQ_RCV=$(aws sqs receive-message --endpoint-url "$ENDPOINT_URL" --queue-url "$DLQ_URL" --wait-time-seconds 1)
          if [ -n "$DLQ_RCV" ]; then
            echo "DLQ is not empty!"
            exit 1
          fi
          echo "DLQ redrive validation PASSED!"

      - name: Teardown Terraform Infrastructure
        if: always()
        run: |
          cd infra
          terraform destroy -input=false -var-file=local.tfvars -auto-approve || true
          if [ -f backend.tf.bak ]; then
            mv backend.tf.bak backend.tf
          fi

      - name: Teardown LocalStack
        if: always()
        run: docker compose down -v

  terraform-check:
    name: terraform-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate
