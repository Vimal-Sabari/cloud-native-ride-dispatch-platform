services:
  localstack:
    container_name: ride-dispatch-localstack
    image: localstack/localstack:3.8.1
    ports:
      - '4566:4566'
    environment:
      - DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
      - MAIN_DOCKER_NETWORK=ride-dispatch
      - LAMBDA_DOCKER_NETWORK=ride-dispatch
      - LOCALSTACK_CONTAINER_NAME=ride-dispatch-localstack
      - MAIN_CONTAINER_NAME=ride-dispatch-localstack
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SERVICES=iam,sts,dynamodb,lambda,apigateway,s3,sqs,sns,logs,cloudwatch,events
      - DEBUG=1
    hostname: localstack
    networks:
      - ride-dispatch
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ['CMD', 'awslocal', 's3', 'ls']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  ride-dispatch:
    name: ride-dispatch

volumes:
  localstack-data:
