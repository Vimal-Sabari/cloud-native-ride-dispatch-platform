services:
  localstack:
    container_name: ride-dispatch-localstack
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    environment:
      - DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
      - MAIN_DOCKER_NETWORK=ride-dispatch
    hostname: localstack
    networks:
      - ride-dispatch
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  ride-dispatch:
    name: ride-dispatch

volumes:
  localstack-data:
